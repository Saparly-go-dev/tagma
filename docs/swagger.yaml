        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get tradeAgent information by id
      tags:
      - agent
    put:
      consumes:
      - application/json
      description: Update a tradeAgent.
      operationId: update-tradeAgent
      parameters:
      - description: TradeAgent ID
        in: path
        name: id
        required: true
        type: integer
      - description: TradeAgent information
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.CreateTradeAgent'
