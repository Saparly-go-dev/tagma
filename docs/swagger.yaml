info:
  contact: {}
  description: API Server for Tagma
  title: Tagma API
  version: "1.0"
paths:
  /api/agents:
    get:
      consumes:
      - application/json
      description: Get all trade agents with pagination.
      operationId: get-all-data
      parameters:
      - description: Number of Trade Agent per page
        in: query
        name: pageSize
        type: integer
      - description: Page number (starts from 1)
        in: query
        name: pageNumber
        type: integer
      - description: TradeAgent name to filter by (optional)
        in: query
        name: name
        type: string
      - description: Language (optional)
        in: header
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of cities
          schema:
            $ref: '#/definitions/models.TradeAgentPage'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get All Trade Agents
      tags:
      - agent
    post:
      consumes:
      - application/json
      description: create tradeAgent
      operationId: create-tradeAgent
      parameters:
      - description: tradeAgent info
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.CreateTradeAgent'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            type: integer
        "400":
          description: Bad Request
          schema:
            type: "404"
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
        default:
          description: ""
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create TradeAgent
      tags:
      - agent
  /api/agents/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a tradeAgent.
      operationId: delete-tradeAgent
      parameters:
      - description: TradeAgent ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success"  "TradeAgent deleted
          schema:
            type: integer
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: TradeAgent not found
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete TradeAgent
      tags:
      - agent
    get:
      consumes:
      - application/json
      description: Get tradeAgent by id
      operationId: get-tradeAgent-id
      parameters:
      - description: TradeAgent ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
